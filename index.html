<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis cuentas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0B10;--s1:#15111A;--s2:#1C1622;--s3:#2A2231;--line:#2E2535;--tx:#F4EEF6;--mut:#A99FB0;--soft:#D9C9DF;--ac:#FF4D9D;--acd:#3A1430;--ok:#6EE7A8;--warn:#FFA94D;--bad:#FF5C6C;--r:20px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac);text-decoration:none}
h1,h2,h3{margin:0;font-family:'Space Grotesk',Inter,sans-serif}
.num{font-family:'Space Grotesk',Inter,sans-serif;font-variant-numeric:tabular-nums}
#app{display:flex;min-height:100vh}
#side{display:none}
#main{flex:1;min-width:0;padding:16px 16px 110px;max-width:1180px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 16px}
.top h1{font-size:24px}
.sub{font-size:13px;color:var(--mut)}
.card{min-width:0;background:var(--s2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.f1{flex:1 1 0;min-width:0}
.hero{background:linear-gradient(160deg,#3A1430 0%,#1C1622 70%);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;animation:up .45s both}
.big{font-size:40px;font-weight:700;letter-spacing:-1px}
.lbl{font-size:12px;color:var(--soft)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:none;background:var(--s2);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ac);color:#1A0712}
.btn.ok{background:var(--ok);color:#062114}
.btn.ghost{background:transparent;border:1px solid #4A3D52}
.btn.dash{background:transparent;border:1px dashed #4A3D52;font-weight:500}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.icon{width:44px;padding:0;border-radius:22px}
.btn.danger{background:transparent;border:1px solid #5A2230;color:#FF8A95}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1 1 0;min-height:36px;border:none;border-radius:9px;background:transparent;color:var(--mut);font-weight:600;font-size:14px;cursor:pointer;transition:background .25s,color .25s;padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--ac);color:#1A0712}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:none;background:var(--s2);color:var(--soft);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.in{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font-size:15px;width:100%}
textarea.in{padding:12px 14px;min-height:110px;resize:vertical}
.in:focus{outline:2px solid var(--ac);outline-offset:1px}
.amount{font-size:46px;font-weight:700;text-align:center;background:transparent;border:none;width:100%;color:var(--tx)}
.amount:focus{outline:none}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #241D2A;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;color:inherit}
.item:last-child{border-bottom:none}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700;font-family:'Space Grotesk',sans-serif}
.dot{width:10px;height:10px;border-radius:5px;flex:0 0 auto}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.bar>div{height:6px;border-radius:3px;transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;transition:width .5s}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{min-height:70px;border-radius:14px;border:1px solid var(--line);background:var(--s2);color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:6px 4px;font-size:11px;line-height:1.2;text-align:center;transition:transform .12s}
.cat:active{transform:scale(.95)}
.cat.on{border-color:var(--ac);background:var(--acd);color:var(--tx)}
.cat b{font-size:18px;font-family:'Space Grotesk',sans-serif}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--s3)}
.warnbox{border-radius:14px;padding:12px 14px;background:#2A1218;border:1px solid #5A2230;font-size:13px;color:#FFC2C8}
.infobox{border-radius:14px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--soft)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--mut);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.t td{padding:10px 6px;border-bottom:1px solid #241D2A}
table.t td.r,table.t th.r{text-align:right}
.scroll-x{overflow-x:auto}
nav#bottom{position:fixed;left:0;right:0;bottom:0;height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(21,17,26,.96);backdrop-filter:blur(10px);border-top:1px solid #241D2A;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;z-index:20}
nav#bottom a{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:11px}
nav#bottom a.on{color:var(--ac)}
nav#bottom a.fab{width:56px;height:56px;margin-top:-22px;border-radius:28px;background:var(--ac);color:#1A0712;justify-content:center;box-shadow:0 8px 24px rgba(255,77,157,.35);transition:transform .2s}
nav#bottom a.fab:active{transform:scale(.92) rotate(90deg)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;animation:fade .2s both;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;padding:16px 18px calc(24px + env(safe-area-inset-bottom));animation:slide .3s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;animation:up .3s both;max-width:90vw}
.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pinpad button{height:72px;border-radius:36px;border:none;background:var(--s2);font-size:24px;font-weight:600;cursor:pointer}
.pins{display:flex;gap:14px}.pins span{width:14px;height:14px;border-radius:7px;border:2px solid var(--mut)}.pins span.on{background:var(--ac);border-color:var(--ac)}
.donut{width:136px;height:136px;border-radius:68px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.donut>div{width:94px;height:94px;border-radius:47px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.months{height:150px;display:flex;align-items:flex-end;gap:8px}
.months>div{flex:1 1 0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0}
.stack{display:flex;flex-direction:column-reverse;gap:2px;border-radius:6px;overflow:hidden;transform-origin:bottom;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.veh{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.vehcard{flex:0 0 200px;background:var(--s1);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.vehimg{height:110px;background:#241D2A center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#6B5F74}
.preview-wrap{background:#2b2430;border-radius:16px;padding:16px;display:flex;justify-content:center}
.inv{width:100%;max-width:620px;aspect-ratio:210/297;background:#fff;color:#1e1e1e;font-family:Roboto,Arial,sans-serif;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;container-type:inline-size;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.inv img{width:100%;display:block}
.inv .cabfake{height:20.3cqw;background:#3a1430;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:5.5cqw;letter-spacing:.3cqw}
.inv .bd{flex:1;padding:4.2cqw 8.6cqw 2cqw;display:flex;flex-direction:column;gap:2.4cqw;font-size:1.75cqw;letter-spacing:.1cqw}
.inv .bx{border:.4cqw solid #1e0a10;border-radius:.4cqw;padding:1.3cqw 1.6cqw;line-height:1.5}
.inv .hd{display:flex;justify-content:space-between;font-weight:700;font-size:2cqw;border-bottom:.4cqw solid #1e1e1e;padding-bottom:1cqw;letter-spacing:.17cqw}
.inv .tot{align-self:flex-end;width:52%;display:flex;flex-direction:column;gap:1cqw;font-size:2cqw}
.inv .pie{background:#2a2a2a;color:#ededed;text-align:center;font-size:1.2cqw;letter-spacing:.32cqw;padding:2.2cqw 1cqw;line-height:1.8}
.face{width:22px;height:22px;flex:0 0 auto;vertical-align:middle}
.desk-only{display:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes out{to{opacity:0;transform:translateX(60px);background:#123524}}
.leaving{animation:out .35s ease forwards}
@media (min-width:900px){
  #side{display:flex;flex-direction:column;gap:6px;width:240px;flex:0 0 240px;padding:28px 16px;background:var(--s1);border-right:1px solid #241D2A;position:sticky;top:0;height:100vh}
  #side .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:1px;padding:0 12px 18px}
  #side a{min-height:44px;padding:0 12px;border-radius:12px;color:var(--soft);font-size:14px;display:flex;align-items:center;gap:10px}
  #side a.on{background:var(--acd);color:var(--tx);font-weight:600}
  nav#bottom{display:none}
  #main{padding:20px 32px 40px}
  .desk-only{display:block}
  .home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet-bg{align-items:center}
  .sheet{border-radius:24px}
  .toast{bottom:30px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="main"><p class="sub">Cargando…</p></main>
</div>
<nav id="bottom"></nav>
<div id="layer"></div>
<script src="pdf.js"></script>
<script src="zip.js"></script>
<script src="google.js"></script>
<script src="app.js"></script>
</body>
</html>
